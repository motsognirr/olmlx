name: Aider Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  # NOTE: the `gpt-review` and `deepseek-review` job names are referenced by
  # factory-babysit.yml's MERGE READINESS gate (it waits for these reviewer
  # check runs before merging). If you rename them, update that gate too.
  gpt-review:
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs don't receive repo secrets, so the review
    # would only fail noisily — skip it instead. Issue #470.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # `gpt-5.6-luna` is the budget tier of the GPT-5.6 family and the direct
      # successor to gpt-5.4-mini: ahead on 27 of 32 shared benchmarks
      # (SWE-bench Verified 93 vs 73) at ~73% lower cost ($0.20/$1.20 vs
      # $0.75/$4.50 per 1M). Generation is ~2x slower — the only regression —
      # against a job that runs in ~1 min.
      # Provider-prefixed like the deepseek job below. The toolchain this
      # action pins (aider 0.86.2 / litellm 1.81.10) predates GPT-5.6 metadata,
      # so a bare name would resolve only via litellm's name-based provider
      # guessing — which can shift under a `@v1` (moving tag) or litellm bump.
      # `openai/` pins the routing instead. That matters because gpt-review is
      # one of the check runs factory-babysit.yml's MERGE READINESS gate waits
      # on, so a resolution regression blocks merges rather than just skipping
      # the review.
      - name: Run Aider Code Review (gpt-5.6-luna)
        uses: motsognirr/aider-code-review@v1
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: openai/gpt-5.6-luna

  deepseek-review:
    runs-on: ubuntu-latest
    # Same-repo PRs only (see `gpt-review`). Issue #470.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # `deepseek-flash` = DeepSeek-V4.1-Flash (released 2026-09-10), the newest
      # model on the first-party API. The old `deepseek-v4-pro` alias has been
      # routed to V4.1-Flash since 2026-09-14 and V4.1-Flash beats V4-Pro on
      # coding benchmarks (DeepSWE v1.1: 74.2 vs 62.7). Revisit when V4.1-Pro ships.
      - name: Run Aider Code Review (deepseek-flash)
        uses: motsognirr/aider-code-review@v1
        with:
          deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: deepseek/deepseek-flash
